# Local AWS networking lab: Floci (AWS emulator) + WAF enforcer + backend apps.
#
#   you ──► :8080 waf-enforcer ──► floci ALB listener :80 ──► app-a / app-b
#           (applies your WAFv2       (path/host rules,         ("private subnet"
#            web ACL from Floci)        target groups)            IP targets)
#
#   :8081 goes straight to the ALB, skipping WAF — handy for comparing.
#
# Terraform runs in a container too, so the host only needs Docker:
#   docker compose run --rm terraform init
#   docker compose run --rm terraform apply -auto-approve

services:
  floci:
    image: floci/floci:2.4.0
    ports:
      - "127.0.0.1:4566:4566"   # AWS API endpoint
      - "127.0.0.1:8081:80"     # ALB listener (direct, no WAF)
    environment:
      # Bedrock Converse is forwarded to a local OpenAI-compatible LLM (used by ../soc-lab).
      # Harmless when nothing is listening: only Bedrock calls would fail.
      FLOCI_SERVICES_BEDROCK_RUNTIME_BACKEND: proxy
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_DEFAULT_MODEL: ${LOCAL_MODEL:-qwen2.5:7b}
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_MODEL_MAPPING: ${BEDROCK_MODEL_MAPPING:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; a no-op elsewhere
    networks:
      lab:
        ipv4_address: 172.30.0.2

  waf-enforcer:
    build: ./waf-enforcer
    ports:
      - "127.0.0.1:8080:8080"   # front door: WAF -> ALB
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ALB_NAME: lab-alb
      UPSTREAM_HOST: floci
      UPSTREAM_PORT: "80"
      LOG_BUFFER: "2000"
    depends_on: [floci]
    networks:
      lab:
        ipv4_address: 172.30.0.3

  app-a:
    image: traefik/whoami:v1.10
    command: ["--name", "app-a"]
    networks:
      lab:
        ipv4_address: 172.30.11.10

  app-b:
    image: traefik/whoami:v1.10
    command: ["--name", "app-b"]
    networks:
      lab:
        ipv4_address: 172.30.12.10

  terraform:
    profiles: ["tools"]
    image: hashicorp/terraform:1.13.4
    working_dir: /work
    volumes:
      - ./terraform:/work
    environment:
      TF_VAR_aws_endpoint: http://floci:4566
      TF_IN_AUTOMATION: "1"
    networks: [lab]

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/16
          ip_range: 172.30.200.0/24   # dynamic IPs stay clear of the fixed ones above
